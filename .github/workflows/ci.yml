name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format + build
    # PINNED, not `ubuntu-latest`: see the `test` job, which is why. Both jobs
    # share one image so the build and the tests cannot see different systems.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # NO `version` INPUT, deliberately: the action reads `packageManager` from
      # the root package.json, which is the ONE place this repo's pnpm version is
      # written (and what a developer's bare `pnpm` self-forwards to, so CI and a
      # laptop cannot drift). This is not merely tidier: the action REFUSES to run
      # with both, failing with "Multiple versions of pnpm specified" whenever the
      # `version` input is not string-equal to the `packageManager` field — which
      # an exact-version-plus-hash pin never is.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      # The published .d.ts files must only import packages the package declares
      # as a dependency or peer (a devDependency is invisible to consumers).
      - run: pnpm check:type-deps

  test:
    # Two engines on purpose. A JS EVM and a wasm EVM do not degrade the same way
    # across engines: on a quiet machine @ethereumjs/evm is ~1.3-1.9x slower on
    # WebKit (JavaScriptCore) than on V8, while revm-wasm shows no penalty. That
    # widens revm's lead from ~11x to ~18x and, more usefully, leaves the JS node
    # at ~90% of a 60fps frame budget on WebKit against revm's ~30%. Measuring
    # only Chromium hides it. (CI numbers themselves are too noisy to assert on --
    # only gas and result equality are asserted here.)
    name: test (${{ matrix.browser }})
    # PINNED to an image Playwright supports. `ubuntu-latest` moved to 26.04, on
    # which Playwright 1.60 refuses to install its browsers ("Playwright does not
    # support chromium on ubuntu26.04-x64"), so every test job failed at
    # `playwright install` before running a test. Move this forward together with
    # a Playwright that supports the newer image.
    runs-on: ubuntu-24.04
    # A green job takes about 3 to 4 minutes. Without this, a stalled step (the
    # webkit `install browser` step once hung for over 25 minutes) holds the job
    # for GitHub's six-hour default; 20 turns that into a fast red a re-run clears.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      # The version comes from `packageManager` in the root package.json; see the
      # note on the `check` job above.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: install browser
        run: pnpm --filter webevm exec playwright install --with-deps ${{ matrix.browser }}

      # Correctness + honesty suite: differential conformance vs a trie-backed
      # @ethereumjs/vm reference, GeneralStateTests, the viem surface, persistence
      # across a real reload, the Worker wrapper, and senderMode:'trusted'
      # equivalence.
      - name: library tests
        run: pnpm --filter webevm exec playwright test --project=${{ matrix.browser }}

      # @webevm/devnode: dev accounts funded at genesis and everything else
      # forwarded, on both engines. Same Playwright as webevm, so the browser
      # installed above serves it.
      - name: devnode tests
        run: pnpm --filter @webevm/devnode exec playwright test --project=${{ matrix.browser }}

      # The cross-backend GATE. What is asserted here is load-INVARIANT --
      # execution-gas equality and keccak-chain equality across every backend --
      # which is precisely what survives a noisy shared CI runner. The MGas/s and
      # frame timings are printed for information and are NOT asserted on; treat
      # CI numbers as indicative only and measure perf locally.
      #
      # EVERY backend runs here, revm-wasm included: its module is an ordinary
      # npm dependency (`revm-wasm`, prebuilt .wasm in the tarball), so there is
      # no build step and no artifact to fetch. The suite fails if any backend
      # drops out, because a gate that silently loses a backend is not a gate.
      - name: cross-backend gate
        run: pnpm --filter webevm-benchmarks test --project=${{ matrix.browser }}
