name: release

# Changesets release flow:
#   1. Land PRs that include a changeset (`.changeset/*.md`) on main.
#   2. This workflow opens/updates a "Version Packages" PR that bumps versions
#      and updates changelogs from the pending changesets.
#   3. Merging that PR (which removes the changesets) makes this workflow run
#      `changeset publish`, publishing the changed packages to npm.
#
# Auth is npm Trusted Publishing (OIDC): NO NPM_TOKEN secret. npm trusts this
# repo + workflow (release.yml) via the trusted publisher registered on the
# package's npmjs.com settings. The OIDC handshake needs `id-token: write`,
# Node >= 22, and a recent pnpm; publishes are stamped with provenance.
# RENAMED 2026-08-16: this package was published as `embedded-eth-node` up to
# 0.4.0 and is `webevm` from 0.5.0 on (`docs/adr/0011-the-package-is-named-webevm.md`).
# The trusted publisher is per-PACKAGE and is bound to the repo NAME in the OIDC
# subject claim, so `webevm` needs its own trusted-publisher entry pointing at
# whatever this repo is called now plus this workflow filename. A repo rename
# that is not mirrored into that entry breaks publishing with an auth error,
# even though GitHub still redirects the old repo URL.
#
# WHY THIS WORKFLOW DOES NOT RUN THE TEST SUITE, deliberately: `release:ci` runs
# `format:check` + `build` only. The full matrix (Playwright on Chromium AND
# WebKit, the differential conformance battery, and the cross-backend gas gate)
# lives in `ci.yml`, which runs on `pull_request` and on `push` to main.
#
# CORRECTED 2026-08-02, having watched two releases: an earlier version of this
# comment claimed the Version Packages PR "gets the full matrix before it can be
# merged". It does NOT, automatically. That PR is opened by the changesets action
# using GITHUB_TOKEN, and GitHub parks workflow runs triggered that way in
# `action_required` pending manual approval, so the PR's CI sits queued and never
# runs unless a human approves it (`gh api -X POST
# repos/<owner>/<repo>/actions/runs/<id>/approve`). The 0.1.0 release was
# published with no CI run on its version PR at all.
#
# The reasoning survives, but the load-bearing part is different from what was
# written: the Version Packages PR changes ONLY the package version, CHANGELOG.md
# and the consumed `.changeset/*.md` files. It touches NO source, so the tree it
# publishes is, source-wise, exactly the commit on main that the full matrix
# already passed on `push`. That is what makes skipping the matrix here safe, not
# the PR's own (usually unrun) checks. Approving the PR run is still worth doing
# for a release you care about, since it re-proves the lockfile and the build.
#
# The reasoning fails if a version PR ever carries a source change, or if you
# publish from a commit that never landed on main.
on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab, e.g. to (re-)run the Version-PR / publish
  # step after a merge that did not emit a push event (a GITHUB_TOKEN API merge
  # does not trigger `on: push`), or to re-publish idempotently.
  workflow_dispatch: {}

# Serialize release runs on main, but NEVER cancel an in-progress one:
# `changeset publish` may be mid-publish, and cancelling it would drop the
# release. `changeset publish` is idempotent (it skips versions already on npm),
# so letting each queued run finish is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # NO `version` input: the action reads `packageManager` from the root
        # package.json, which is where this repo's pnpm version now lives (an
        # EXACT version plus its integrity hash, so a release is built by the same
        # pnpm that built the commit CI passed). This used to pin `version: 10`
        # explicitly, with a comment saying it had to because no `packageManager`
        # field existed; it does now, and two pins that can disagree is exactly
        # what a release must not have.
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24 # >= 22 required for npm OIDC trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # release:ci format-checks + builds then runs `changeset publish` (the
          # action itself handles git commits/tags, so no git push here -- unlike
          # the local `release` script, which pushes branches and tags itself).
          # No NPM_TOKEN: npm detects the OIDC environment and authenticates via
          # the registered trusted publisher.
          publish: pnpm release:ci
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
